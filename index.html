<!DOCTYPE html>
<html>
<head>
  <title>Z Number Lookup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      margin-top: 10px;
    }

    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }

    .label {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Z Number Lookup</h1>

<input
  id="searchBox"
  placeholder="Enter Rental Number"
  oninput="lookup()"
/>

<div class="card">
  <div class="label">Owner</div>
  <div id="owner">---</div>

  <div class="label">Z Number</div>
  <div id="znumber">---</div>
</div>
<script src="app.js"></script>>
  </body>
</html>
